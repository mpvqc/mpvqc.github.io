<a class="wordmark" href="{{ "" | relURL }}" aria-label="mpvQC home">{{ .Site.Title }}</a>
<nav class="site-nav" aria-label="Main navigation">
  {{ range .Site.Menus.main }}
    <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}{{ if not .Page }} <span aria-hidden="true">↗</span>{{ end }}</a>
  {{ end }}
</nav>
