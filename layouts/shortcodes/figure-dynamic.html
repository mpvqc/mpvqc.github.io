<figure class="screenshot">
  <picture>
    <source srcset="{{ .Get "dark-src" | relURL }}" media="(prefers-color-scheme: dark)">
    <img src="{{ .Get "light-src" | relURL }}" alt="{{ .Get "alt" }}" loading="lazy" decoding="async"
      {{- with .Get "width" }} width="{{ . }}"{{ end -}}
      {{- with .Get "height" }} height="{{ . }}"{{ end -}}>
  </picture>
  {{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
