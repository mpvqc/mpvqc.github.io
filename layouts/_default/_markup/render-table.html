<div class="table-scroll" role="region" aria-label="Reference table {{ add .Ordinal 1 }}" tabindex="0">
  <table>
    <thead>
      {{ range .THead }}
        <tr>{{ range . }}<th scope="col"{{ with .Alignment }} class="align-{{ . }}"{{ end }}>{{ .Text }}</th>{{ end }}</tr>
      {{ end }}
    </thead>
    <tbody>
      {{ range .TBody }}
        <tr>{{ range . }}<td{{ with .Alignment }} class="align-{{ . }}"{{ end }}>{{ .Text }}</td>{{ end }}</tr>
      {{ end }}
    </tbody>
  </table>
</div>
