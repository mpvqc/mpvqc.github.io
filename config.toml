# Base URL used when generating links to your pages
# Set to the URL for your site
baseURL = "https://mpvqc.github.io"

title = "mpvQC"
author = "mpvQC developers"
copyright = "&copy; mpvQC developers"
locale = "en-US"

# Generate a nice robots.txt for SEO
enableRobotsTXT = true

disableKinds = ["RSS", "taxonomy", "term"]

[params]
# The "description" of your website. This is used in the metadata of your generated html.
description = "Watch a video, take quality control notes, and share a report. Free and open source for Windows and Linux."

# The path to your "favicon". This should be a square (at least 32px x 32px) png-file.
# Hint: It's good practise to also put a "favicon.ico"-file into your "static"-folder.
favicon = "images/favicon.png"

# These "images" are used for the structured data templates. This will show up, when
# services like Twitter or Slack want to generate a preview of a link to your site.
# See https://gohugo.io/templates/internal#twitter-cards and
# https://gohugo.io/templates/internal#open-graph.
images = ["images/logo.png"]

# Another "title" :-). This one is used as the site_name on the Hugo's internal
# opengraph structured data template.
# See https://ogp.me/ and https://gohugo.io/templates/internal#open-graph.
title = "mpvQC"

[[menu.main]]
name = "Install"
pageRef = "/installation"
weight = 1

[[menu.main]]
name = "Export templates"
pageRef = "/export-templates"
weight = 2

[[menu.main]]
name = "Source"
url = "https://github.com/mpvqc/mpvQC"
weight = 3

[markup.tableOfContents]
startLevel = 2
endLevel = 2

[markup.highlight]
noClasses = false

[markup.goldmark.parser.attribute]
block = true

# Keep the legacy URL available without maintaining a second version payload.
[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "static/api/v1/public/version.json"
target = "static/api/v1/public/version"
